<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090B0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Discover — VIRALX</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/viralx.css">
</head>
<body>
<main class="page">
  <h1 class="chrome">DISCOVER</h1>
  <form id="search-form">
    <input id="q" type="search" placeholder="Search videos, #hashtags, @creators">
    <button class="btn btn-green btn-block" type="submit" style="margin-top:10px;">Search</button>
  </form>
  <p class="form-error" id="s-error"></p>
  <div id="results"></div>
  <div class="card">
    <h3 style="margin-top:0;">🎵 Music Search — every platform</h3>
    <p class="muted">Search any song, artist or beat across the free music platforms:</p>
    <input id="mq" type="search" placeholder="Search any song, artist, beat…">
    <button class="btn btn-green btn-block" type="button" id="mq-all" style="margin-top:10px;">🌍 Search ALL platforms</button>
    <p class="form-error" id="m-error"></p>
    <div id="mq-results"></div>
    <div id="music-platforms" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;">
      <button class="btn" type="button" data-mq="youtube">▶️ YouTube</button>
      <button class="btn" type="button" data-mq="ytmusic">🎧 YouTube Music</button>
      <button class="btn" type="button" data-mq="spotify">🟢 Spotify</button>
      <button class="btn" type="button" data-mq="soundcloud">🟠 SoundCloud</button>
      <button class="btn" type="button" data-mq="apple">🍎 Apple Music</button>
      <button class="btn" type="button" data-mq="audiomack">🔶 Audiomack</button>
      <button class="btn" type="button" data-mq="google">🔎 Google</button>
      <button class="btn" type="button" data-mq="yahoo">🟣 Yahoo</button>
    </div>
  </div>
  <div class="card">
    <h3 style="margin-top:0;">Trending tags</h3>
    <p><a href="index.html">#viralx</a> · <a href="index.html">#brooklyn</a> · <a href="index.html">#moneymotion</a> · <a href="index.html">#studio</a></p>
  </div>
</main>

<nav class="bottomnav">
  <a href="index.html"><span class="ic">⌂</span>Home</a>
  <a href="discover.html" class="active"><span class="ic">◎</span>Discover</a>
  <a href="create.html" class="create"><span class="ic">+</span>Create</a>
  <a href="live.html"><span class="ic">●</span>LIVE</a>
  <a href="profile.html"><span class="ic">◉</span>Profile</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
// ---- music search: one box, every platform ----
(function () {
  var URLS = {
    youtube: "https://www.youtube.com/results?search_query=",
    ytmusic: "https://music.youtube.com/search?q=",
    spotify: "https://open.spotify.com/search/",
    soundcloud: "https://soundcloud.com/search?q=",
    apple: "https://music.apple.com/us/search?term=",
    audiomack: "https://audiomack.com/search?q=",
    google: "https://www.google.com/search?q=",
    yahoo: "https://search.yahoo.com/search?p="
  };
  var NAMES = {
    youtube: "▶️ YouTube", ytmusic: "🎧 YouTube Music", spotify: "🟢 Spotify",
    soundcloud: "🟠 SoundCloud", apple: "🍎 Apple Music", audiomack: "🔶 Audiomack",
    google: "🔎 Google", yahoo: "🟣 Yahoo"
  };
  function mqQuery() {
    var q = document.getElementById("mq").value.trim();
    var err = document.getElementById("m-error");
    if (!q) { err.textContent = "Type a song, artist or beat first."; return ""; }
    err.textContent = "";
    return q;
  }
  document.getElementById("music-platforms").addEventListener("click", function (e) {
    var b = e.target.closest("[data-mq]");
    if (!b) return;
    var q = mqQuery();
    if (!q) return;
    window.open(URLS[b.getAttribute("data-mq")] + encodeURIComponent(q), "_blank", "noopener");
  });
  document.getElementById("mq-all").addEventListener("click", function () {
    var q = mqQuery();
    if (!q) return;
    var box = document.getElementById("mq-results");
    box.innerHTML = "";
    var h = document.createElement("p");
    h.innerHTML = "<b>“" + q.replace(/</g, "&lt;") + "” — on every platform:</b>";
    box.appendChild(h);
    Object.keys(URLS).forEach(function (k) {
      var p = document.createElement("p");
      p.style.margin = "8px 0";
      var a = document.createElement("a");
      a.href = URLS[k] + encodeURIComponent(q);
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = NAMES[k] + " — find it here";
      p.appendChild(a);
      box.appendChild(p);
    });
  });
})();

document.getElementById("search-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  var q = document.getElementById("q").value.trim();
  var out = document.getElementById("results");
  var err = document.getElementById("s-error");
  err.textContent = ""; out.innerHTML = "";
  if (!q) return;
  var sb = window.VX && window.VX.sb;
  if (!sb) { err.textContent = "Search goes live with the backend — try the feed tabs meanwhile."; return; }
  var clean = q.replace(/[%_]/g, "");
  // creators first (plain queries only — profiles embeds into videos error
  // out on this schema with "more than one relationship")
  var pr = await sb.from("profiles")
    .select("id,username,display_name")
    .or("username.ilike.%" + clean + "%,display_name.ilike.%" + clean + "%")
    .limit(10);
  if (pr.data && pr.data.length) {
    var h = document.createElement("h3"); h.textContent = "Creators"; out.appendChild(h);
    pr.data.forEach(function (p) {
      var d = document.createElement("div");
      d.className = "card";
      d.innerHTML = "<b>@" + p.username + "</b>" +
        '<p class="muted">' + (p.display_name || "") + '</p>' +
        '<a class="btn" href="index.html">View the feed</a>';
      out.appendChild(d);
    });
  }
  var res = await sb.from("videos")
    .select("id,user_id,caption,video_url,like_count")
    .eq("status", "active")
    .or("caption.ilike.%" + clean + "%,hashtags.cs.{" + (q.startsWith("#") ? q : "#" + q) + "}")
    .order("created_at", { ascending: false }).limit(20);
  if (res.error) { err.textContent = res.error.message; return; }
  var names = {};
  if (res.data.length) {
    var ids = [];
    res.data.forEach(function (v) { if (ids.indexOf(v.user_id) < 0) ids.push(v.user_id); });
    var who = await sb.from("profiles").select("id,username").in("id", ids);
    if (who.data) who.data.forEach(function (p) { names[p.id] = p.username; });
  }
  if (!res.data.length && !(pr.data && pr.data.length)) { out.innerHTML = '<p class="muted center">No matches yet.</p>'; return; }
  if (res.data.length) {
    var h2 = document.createElement("h3"); h2.textContent = "Videos"; out.appendChild(h2);
  }
  res.data.forEach(function (v) {
    var d = document.createElement("div");
    d.className = "card";
    d.innerHTML = "<b>@" + (names[v.user_id] || "creator") + "</b>" +
      '<a href="index.html?v=' + v.id + '"><video src="' + v.video_url + '" preload="metadata" muted playsinline style="width:100%;border-radius:10px;margin-top:8px;"></video></a>' +
      '<p class="muted">' + (v.caption || "") + " · ▲ " + (v.like_count || 0) + "</p>";
    out.appendChild(d);
  });
});
</script>
<script src="js/fx.js"></script>
<script src="js/install.js"></script>
</body>
</html>
