<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090B0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sound — VIRALX</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/viralx.css">
<style>
  .snd-hero{display:flex;gap:14px;align-items:center}
  .snd-disc{width:74px;height:74px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:32px;background:radial-gradient(circle at 35% 35%,#2b332e,#101312 70%);border:2px solid var(--vx-green);box-shadow:0 0 18px rgba(139,255,0,.35)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:10px}
  .grid a.cell{position:relative;display:block;aspect-ratio:3/4;background:#000;overflow:hidden}
  .grid video{width:100%;height:100%;object-fit:cover;display:block}
  .grid .cc{position:absolute;left:6px;bottom:5px;font-size:11.5px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.8)}
  audio{width:100%;margin-top:10px}
</style>
</head>
<body>
<main class="page narrow">
  <p><a href="index.html">← Back to the feed</a></p>
  <div class="card">
    <div class="snd-hero">
      <div class="snd-disc">🎵</div>
      <div>
        <h1 class="chrome" id="snd-name" style="font-size:21px;margin:0;">Sound</h1>
        <p class="muted" id="snd-sub" style="margin:4px 0 0;">Loading...</p>
      </div>
    </div>
    <div id="snd-preview"></div>
    <a class="btn btn-green btn-block" id="snd-use" href="create.html" style="margin-top:14px;">Use this sound</a>
  </div>
  <h2 style="font-size:16px;margin:18px 0 4px;">Videos with this sound</h2>
  <div class="grid" id="snd-grid"></div>
  <p class="muted" id="snd-empty"></p>
</main>

<nav class="bottomnav">
  <a href="index.html"><span class="ic">⌂</span>Home</a>
  <a href="discover.html"><span class="ic">◎</span>Discover</a>
  <a href="create.html" class="create"><span class="ic">+</span>Create</a>
  <a href="live.html"><span class="ic">●</span>LIVE</a>
  <a href="profile.html"><span class="ic">◉</span>Profile</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/sounds-data.js"></script>
<script src="js/sounds-audio.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  var qs = new URLSearchParams(location.search);
  var sid = qs.get("sid") || "";
  var name = qs.get("name") || "Sound";
  var sb = window.VX && window.VX.sb;
  document.getElementById("snd-name").textContent = name;
  var sub = document.getElementById("snd-sub");
  var prev = document.getElementById("snd-preview");
  var grid = document.getElementById("snd-grid");
  var empty = document.getElementById("snd-empty");
  document.getElementById("snd-use").href = "create.html?sound=" + encodeURIComponent(sid) + "#upload-card";

  function tile(v) {
    var a = document.createElement("a");
    a.className = "cell"; a.href = "index.html?v=" + v.id;
    a.innerHTML = '<video src="' + v.video_url + '" muted playsinline preload="metadata"></video><span class="cc">💬 ' + (v.comment_count || 0) + "</span>";
    return a;
  }

  if (sid.indexOf("lib:") === 0) {
    var lib = (window.VX_SOUNDS || []).filter(function (s) { return s.id === sid; })[0];
    if (lib) {
      document.getElementById("snd-name").textContent = lib.name;
      sub.textContent = "VIRALX sound library · " + lib.genre + " — free to use in your videos";
      prev.innerHTML = '<audio controls preload="metadata" src="' + window.VX_soundSrc(lib) + '"></audio>';
    }
    if (sb) {
      var r = await sb.from("videos").select("id,video_url,comment_count").eq("sound_id", sid).eq("status", "active").order("created_at", { ascending: false }).limit(30);
      if (!r.error && r.data && r.data.length) r.data.forEach(function (v) { grid.appendChild(tile(v)); });
      else empty.textContent = "No videos yet — be the first to use this sound.";
    }
  } else if (sid.indexOf("orig:") === 0) {
    var vid = sid.slice(5);
    sub.textContent = "Original sound from the video below";
    if (sb && vid) {
      var one = await sb.from("videos").select("id,video_url,comment_count,caption").eq("id", vid).maybeSingle();
      if (!one.error && one.data) {
        prev.innerHTML = '<video src="' + one.data.video_url + '" controls playsinline preload="metadata" style="width:100%;border-radius:12px;margin-top:10px;background:#000"></video>';
        grid.appendChild(tile(one.data));
      } else empty.textContent = "That video is gone.";
    }
  } else {
    sub.textContent = "";
    empty.textContent = "Sound not found.";
  }
})();
</script>
<script src="js/fx.js"></script>
<script src="js/install.js"></script>
</body>
</html>
